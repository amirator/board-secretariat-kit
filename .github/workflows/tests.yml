name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m secretariat demo --no-pdf

  pdf-and-formulas:
    # Installs LibreOffice so the PDF export and the Excel-formula-vs-Python check also run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc fonts-crosextra-carlito fonts-noto-core
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -rs
      - run: python -m secretariat demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-outputs
          path: outputs/demo
