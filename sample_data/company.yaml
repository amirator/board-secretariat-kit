# SAMPLE / DEMO DATA. "Demo Coastal Industries Co." and every person below are fictional.
# Names, emails (.example domain), roles and governance rules were invented for this demo.
# Nothing here describes a real company, board or employer.
company:
  name: Demo Coastal Industries Co.
  name_ar: شركة الساحل التجريبية للصناعات
  registered_office: Demo Tower, Jeddah (fictional address)
  timezone: Asia/Riyadh
  weekend: [Fri, Sat]          # due dates that land here roll forward to the next working day
  show_hijri: true             # print the Umm al-Qura date next to the Gregorian date
  due_soon_days: 7             # action-log "Due soon" window
  fonts:
    latin: Calibri             # LibreOffice substitutes Carlito (same metrics) on Linux
    arabic: Noto Naskh Arabic  # any installed Arabic font works; Word falls back if missing
  secretary: YAM

