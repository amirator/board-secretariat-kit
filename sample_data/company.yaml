# Quorum and voting rules are settings, not legal advice. Set them from your own
# articles of association and committee charters.
bodies:
  BOD:
    name: Board of Directors
    name_ar: مجلس الإدارة
    resolution_prefix: BR
    members: [SMU, NSH, KBS, RHD, OFR, TZH, LMN]
    chair: SMU
    quorum: {min_fraction: 0.5, min_count: 3}
    special_majority: 2/3
    chair_casting_vote: true
  AC:
    name: Audit Committee
    name_ar: لجنة المراجعة
    resolution_prefix: ACR
    members: [LMN, OFR, RHD, MGH]
    chair: LMN
    quorum: {min_fraction: 0.5, min_count: 2}
    special_majority: 2/3
    chair_casting_vote: false
